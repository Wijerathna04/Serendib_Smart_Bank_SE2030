spring.application.name=smartbank-api
# Load local credentials when launched from the repository root or backend directory.
spring.config.import=optional:file:./backend/smartbank-api/.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartbank_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
server.port=${PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
jwt.secret=${JWT_SECRET}
bank.security.jwt-hours=24
bank.security.idle-minutes=10
bank.cors.origins=${CORS_ORIGINS:http://localhost:5173}
bank.otp.simulation-enabled=${BANK_OTP_SIMULATION_ENABLED:false}
bank.otp.ttl-seconds=180
bank.otp.max-attempts=5
bank.otp.resend-seconds=30
# Academic demonstration rates only. The backend owns all pricing/calculation.
bank.fixed-deposit.minimum-amount=${FD_MINIMUM_AMOUNT:1000.00}
bank.fixed-deposit.rates[3]=${FD_RATE_3:5.00}
bank.fixed-deposit.rates[6]=${FD_RATE_6:6.00}
bank.fixed-deposit.rates[12]=${FD_RATE_12:7.00}

exchange-rate.api-key=${EXCHANGE_RATE_API_KEY:}

# Opt-in local demonstration administrator (admin / admin).
bank.demo.admin-enabled=${BANK_DEMO_ADMIN_ENABLED:false}

# Opt-in local demonstration manager and staff accounts.
bank.demo.staff-enabled=${BANK_DEMO_STAFF_ENABLED:false}

# Google SMTP Email Notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:wijerathna.dev.2004@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from-email=${MAIL_FROM_EMAIL:wijerathna.dev.2004@gmail.com}
mail.from-name=${MAIL_FROM_NAME:Serendib Smart Bank}

# SMS Gateway & TextBee Integration
sms.provider=${SMS_PROVIDER:NONE}
sms.brand=${SMS_BRAND:Serendib Smart Bank}
textbee.api-key=${TEXTBEE_API_KEY:}
textbee.device-id=${TEXTBEE_DEVICE_ID:}

